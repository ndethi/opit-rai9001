# Expert Source Configuration
# This file defines metadata for expert-curated proverb collections
# Add new expert sources here without modifying code

sources:
  ireri:
    # Margaret Wambere Ireri's collection
    author: "Margaret Wambere Ireri"
    year: 2014
    title: "A Collection of 100 Proverbs and Wise Sayings of the Gikuyu (Kenya) About Money and Wealth"
    language: "kikuyu"
    language_code: "ki"
    domain: "wealth_prosperity"
    total_proverbs: 100
    
    # Extraction configuration
    extraction:
      pattern_type: "numbered"  # Format: "1. Proverb text..."
      number_range: [1, 100]
      start_page: 7
      end_page: 150
    
    # Quality thresholds
    quality:
      min_proverbs: 90  # Minimum proverbs to extract
      max_empty_texts: 10  # Maximum allowed empty text fields
      expected_authenticity: 5.0  # Expert validation level (1.0-5.0)
    
    # File naming templates
    output:
      raw_csv: "ireri_expert_proverbs.csv"
      gold_standard_csv: "gold_standard_ireri.csv"
      metadata_json: "gold_standard_ireri_metadata.json"
      report_md: "ireri_gold_standard_report.md"
    
    # Citation information
    citation:
      format: "APA7"
      text: |
        Ireri, M. W. (2014). A Collection of 100 Proverbs and Wise Sayings 
        of the Gikuyu (Kenya) About Money and Wealth. African Proverbs 
        Working Group, Nairobi, Kenya.

  # Template for future expert sources
  # new_expert:
  #   author: "Full Name"
  #   year: 2025
  #   title: "Collection Title"
  #   language: "swahili"
