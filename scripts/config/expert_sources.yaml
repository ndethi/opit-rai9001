  #   domain: "general"
  #   total_proverbs: 150
  #   
  #   extraction:
  #     pattern_type: "custom"  # or "numbered", "bullet", "paragraph"
  #     start_page: 1
  #     end_page: 100
  #   
  #   quality:
  #     min_proverbs: 130
  #     max_empty_texts: 20
  #     expected_authenticity: 4.5
  #   
  #   output:
  #     raw_csv: "new_expert_proverbs.csv"
  #     gold_standard_csv: "gold_standard_new_expert.csv"
  #     metadata_json: "gold_standard_new_expert_metadata.json"
  #     report_md: "new_expert_gold_standard_report.md"
  #   
  #   citation:
  #     format: "APA7"
  #     text: "Full citation text here"

# Default configuration for all sources
defaults:
  output_directories:
    raw: "data/raw"
    evaluation: "data/evaluation"
    sources: "data/sources"
  
  # Default column names for gold standard format
  gold_standard_columns:
    - proverb_id
    - kikuyu_text
    - expert_translation
    - expert_cultural_meaning
    - literal_meaning
    - contextual_usage
    - thematic_category
    - business_context
    - cultural_authenticity
    - source
    - page_number
    - collection_date
    - validation_status
    - notes
    - wealth_theme_primary
    - wealth_theme_secondary
  
  # Thematic categories (extensible per source)
  thematic_categories:
    - wealth_acquisition
    - wealth_management
    - poverty_hardship
    - business_wisdom
    - generosity_sharing
    - patience_wisdom
    - community_relations
    - work_diligence
