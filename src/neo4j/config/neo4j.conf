# Neo4j Configuration for OG-RAG Research
# Optimized for ontology-grounded retrieval workloads

# Memory Settings
dbms.memory.heap.initial_size=2G
dbms.memory.heap.max_size=4G
dbms.memory.pagecache.size=2G

# Network Settings
dbms.default_listen_address=0.0.0.0
dbms.connector.bolt.listen_address=:7687
dbms.connector.http.listen_address=:7474

# Query Performance
dbms.query_cache_size=1000
cypher.default_columnar_runtime=pipelined
cypher.hints_error=true

# Logging
dbms.logs.query.enabled=true
dbms.logs.query.threshold=1s
dbms.logs.query.parameter_logging_enabled=true

# Security
dbms.security.auth_enabled=true
dbms.security.allow_csv_import_from_file_urls=true

# APOC Plugin Settings
dbms.security.procedures.unrestricted=apoc.*
dbms.security.procedures.allowlist=apoc.*

# Graph Data Science (if using GDS)
gds.enterprise.license_file=

# Import Settings
dbms.directories.import=import
dbms.security.allow_csv_import_from_file_urls=true
