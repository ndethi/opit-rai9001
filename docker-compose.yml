services:
  # Neo4j Graph Database - Core knowledge graph for OG-RAG
  neo4j:
    image: neo4j:5.15-community
    container_name: kikuyu-og-rag-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP Web Interface
      - "7687:7687"   # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/ograg2025
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*,gds.*
      - NEO4J_dbms_memory_heap_initial__size=1G
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=1G
      - NEO4J_dbms_query_cache_size=1000
      - NEO4J_dbms_logs_query_enabled=true
      - NEO4J_dbms_logs_query_threshold=1s
      - NEO4J_dbms_default__database=kikuyu_kg
      - NEO4J_dbms_allow__upgrade=true
    volumes:
      - ./src/neo4j/database:/data
      - ./src/neo4j/logs:/logs
      - ./src/neo4j/imports:/var/lib/neo4j/import
      - ./src/neo4j/plugins:/plugins
      - ./src/neo4j/config/neo4j.conf:/var/lib/neo4j/conf/neo4j.conf:ro
      - ./src/neo4j/backups:/backups
    networks:
      - og-rag-network
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ograg2025 'RETURN 1;' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Jupyter Lab - Research notebooks and experimentation
  jupyter:
    build:
      context: .
      dockerfile: docker/Dockerfile.jupyter
    container_name: og-rag-jupyter
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - JUPYTER_TOKEN=ograg2025
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=ograg2025
    volumes:
      - .:/workspace
      - ./notebooks:/home/jovyan/work
      - jupyter-data:/home/jovyan/.jupyter
    working_dir: /workspace
    networks:
      - og-rag-network
    depends_on:
      neo4j:
        condition: service_healthy
    command: >
      bash -c "
        pip install -r requirements.txt &&
        start-notebook.sh --NotebookApp.token='ograg2025' --NotebookApp.allow_root=True
      "

  # Redis - Caching for embeddings and API responses
  redis:
    image: redis:7-alpine
    container_name: og-rag-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - og-rag-network
    command: redis-server --appendonly yes

  # Ollama - Local LLM inference (optional for offline work)
  ollama:
    image: ollama/ollama:latest
    container_name: og-rag-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - og-rag-network
    profiles:
      - local-llm  # Optional service, start with: docker-compose --profile local-llm up

  # Development Environment - Python with all dependencies
  dev-env:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: og-rag-dev
    restart: unless-stopped
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=ograg2025
      - REDIS_URL=redis://redis:6379
      - PYTHONPATH=/workspace/src
    volumes:
      - .:/workspace
      - dev-cache:/root/.cache
    working_dir: /workspace
    networks:
      - og-rag-network
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_started
    profiles:
      - dev  # Optional service for containerized development
    command: tail -f /dev/null  # Keep container running

volumes:
  # Persistent data volumes
  jupyter-data:
    driver: local
  redis-data:
    driver: local
  ollama-data:
    driver: local
  dev-cache:
    driver: local

networks:
  og-rag-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
